<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>HowLong hourglass icon — animated</title>
  <desc>Animated 180 degree hourglass flip with eased rotation, flowing sand,
  falling grains, subtle face movement, glass reflection and settling motion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#293b58"/><stop offset="1" stop-color="#243752"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf6"/><stop offset="0.55" stop-color="#fff9ed"/><stop offset="1" stop-color="#f7f0df"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0d0"/><stop offset="1" stop-color="#ead4aa"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffb63f"/><stop offset="0.62" stop-color="#f5a72f"/><stop offset="1" stop-color="#df9525"/>
    </linearGradient>
    <linearGradient id="sand2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb642"/><stop offset="1" stop-color="#e49a29"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="205" fill="url(#bg)"/>

  <g id="hourglass">
  <!-- glass silhouette -->
  <path d="M322 214 C309 243 308 279 314 311 C322 357 347 394 387 425 L454 477 C483 500 483 522 454 547 L384 605 C340 641 315 686 315 735 C315 760 320 785 326 802 L699 802 C706 783 710 758 710 735 C710 686 684 641 640 605 L570 547 C541 522 541 500 570 477 L637 425 C677 394 702 357 710 311 C716 279 715 243 702 214 Z" fill="url(#glass)"/>

  <!-- upper sand -->
  <path d="M391 410 C432 402 460 406 488 412 C510 417 533 417 556 412 C585 406 612 402 633 410 L548 471 C525 488 514 504 512 524 C509 505 499 488 476 471 Z" fill="url(#sand)"/>
  <path d="M391 410 C434 404 464 411 491 417 C514 422 539 420 563 414 C590 408 614 404 633 410 L556 463 C530 481 515 486 489 476 C458 464 425 435 391 410Z" fill="#ffb53c" opacity=".52"/>


  <!-- lower sand -->
  <path d="M342 801 C344 772 362 753 393 737 L466 695 C485 684 499 674 512 671 C525 674 539 684 558 695 L631 737 C662 753 680 772 682 801 Z" fill="url(#sand2)"/>
  <path d="M342 801 C344 774 363 755 397 737 L468 697 C485 686 498 678 512 675 C526 680 540 691 558 705 C582 723 604 737 622 748 C647 764 665 782 668 801 Z" fill="#ffb63e" opacity=".58"/>

  <!-- glass highlights -->
  <path d="M622 235 C658 243 680 271 680 305 C680 315 678 325 674 333"
    fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" opacity=".78">
    <animate attributeName="opacity" values=".62;.82;.62" dur="3.2s"
      repeatCount="indefinite"/>
  </path>
  <path d="M600 604 C640 628 667 664 670 705" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" opacity=".72"/>

  <!-- face -->
  <g id="face">
    <g>
      <circle cx="428" cy="315" r="21" fill="#26384f">
        <animate attributeName="ry" values="21;21;2;21;21" dur="4.8s"
                 begin="0s" repeatCount="indefinite"
                 keyTimes="0;.78;.82;.86;1"/>
      </circle>
      <circle cx="596" cy="315" r="21" fill="#26384f">
        <animate attributeName="ry" values="21;21;2;21;21" dur="4.8s"
                 begin="0s" repeatCount="indefinite"
                 keyTimes="0;.78;.82;.86;1"/>
      </circle>
    </g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 3 0; 0 0; -3 0; 0 0"
      keyTimes="0;.25;.5;.75;1" dur="3.2s"
      repeatCount="indefinite"/>
  </g>
  <path d="M487 341 C493 351 503 356 512 356 C522 356 532 351 537 341" fill="none" stroke="#26384f" stroke-width="10" stroke-linecap="round"/>

  <!-- top and bottom wooden caps -->
  <rect x="274" y="133" width="476" height="61" rx="30.5" fill="url(#wood)"/>
  <rect x="319" y="192" width="386" height="28" rx="7" fill="#f3dfbd"/>
  <rect x="274" y="815" width="476" height="58" rx="29" fill="url(#wood)"/>
  <rect x="316" y="800" width="392" height="19" rx="7" fill="#f4e2c2"/>

  <!-- subtle cap highlights -->
  <path d="M305 145 H719" stroke="#fff7e6" stroke-width="7" stroke-linecap="round" opacity=".45"/>

  <!-- Animated sand flow -->
  <g id="sand-flow" pointer-events="none">
    <!-- tapering stream -->
    <path d="M509 475 C510 494 510 518 511 541 L511 576"
          fill="none" stroke="#e89b2b" stroke-width="7"
          stroke-linecap="round">
      <animate attributeName="stroke-width" values="7;6;7" dur="1.25s"
               repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;.72;1" dur="1.25s"
               repeatCount="indefinite"/>
    </path>

    <!-- falling grains -->
    <g fill="#f2a332">
      <circle cx="510" cy="566" r="5.5">
        <animate attributeName="cy" values="566;666;566" dur="1.35s"
                 repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="1.35s"
                 repeatCount="indefinite"/>
      </circle>
      <circle cx="514" cy="576" r="4.5">
        <animate attributeName="cy" values="576;675;576" dur="1.35s"
                 begin=".38s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="1.35s"
                 begin=".38s" repeatCount="indefinite"/>
      </circle>
      <circle cx="511" cy="585" r="3.8">
        <animate attributeName="cy" values="585;681;585" dur="1.35s"
                 begin=".76s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="1.35s"
                 begin=".76s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- tiny impact shimmer -->
    <circle cx="512" cy="679" r="3" fill="#ffd079">
      <animate attributeName="r" values="2;7;2" dur="1.35s"
               repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".15;.7;.15" dur="1.35s"
               repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- very subtle physical settling after the flip -->
  <animateTransform attributeName="transform" type="rotate"
    values="0 512 512; 150 512 512; 180 512 512; 182 512 512; 180 512 512; 0 512 512"
    keyTimes="0;.35;.68;.72;.77;1"
    dur="6.4s" repeatCount="indefinite"
    calcMode="spline"
    keySplines=".42 0 .58 1; .22 1 .36 1; .25 .1 .25 1; .42 0 .58 1; .42 0 .58 1"/>
  </g>
</svg>
