<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>HowLong hourglass icon - Rotating with sand flow</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#293b58"/><stop offset="1" stop-color="#243752"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf6"/><stop offset="0.55" stop-color="#fff9ed"/><stop offset="1" stop-color="#f7f0df"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0d0"/><stop offset="1" stop-color="#ead4aa"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffb63f"/><stop offset="0.62" stop-color="#f5a72f"/><stop offset="1" stop-color="#df9525"/>
    </linearGradient>
    <linearGradient id="sand2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb642"/><stop offset="1" stop-color="#e49a29"/>
    </linearGradient>
    
    <!-- Clipping paths for sand animation -->
    <clipPath id="top-chamber">
      <path d="M322 214 C309 243 308 279 314 311 C322 357 347 394 387 425 L454 477 C483 500 483 522 454 547 L384 605 C340 641 315 686 315 735 C315 760 320 785 326 802 L699 802 C706 783 710 758 710 735 C710 686 684 641 640 605 L570 547 C541 522 541 500 570 477 L637 425 C677 394 702 357 710 311 C716 279 715 243 702 214 Z"/>
    </clipPath>
  </defs>

  <!-- Static background rectangle -->
  <rect width="1024" height="1024" rx="205" fill="url(#bg)"/>

  <!-- Static wooden caps -->
  <rect x="274" y="133" width="476" height="61" rx="30.5" fill="url(#wood)"/>
  <rect x="319" y="192" width="386" height="28" rx="7" fill="#f3dfbd"/>
  <rect x="274" y="815" width="476" height="58" rx="29" fill="url(#wood)"/>
  <rect x="316" y="800" width="392" height="19" rx="7" fill="#f4e2c2"/>
  <path d="M305 145 H719" stroke="#fff7e6" stroke-width="7" stroke-linecap="round" opacity=".45"/>

  <!-- Rotating group for the hourglass -->
  <g id="rotating-hourglass" transform-origin="512 512">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 512 512"
      to="360 512 512"
      dur="10s"
      repeatCount="indefinite"
    />
    
    <!-- glass silhouette -->
    <path d="M322 214 C309 243 308 279 314 311 C322 357 347 394 387 425 L454 477 C483 500 483 522 454 547 L384 605 C340 641 315 686 315 735 C315 760 320 785 326 802 L699 802 C706 783 710 758 710 735 C710 686 684 641 640 605 L570 547 C541 522 541 500 570 477 L637 425 C677 394 702 357 710 311 C716 279 715 243 702 214 Z" fill="url(#glass)"/>

    <!-- glass highlights (rotating with glass) -->
    <path d="M622 235 C658 243 680 271 680 305 C680 315 678 325 674 333" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" opacity=".78"/>
    <path d="M600 604 C640 628 667 664 670 705" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" opacity=".72"/>

    <!-- Sand animation: sand flows from top to bottom -->
    <!-- Top sand - will shrink as sand flows down -->
    <path d="M391 410 C432 402 460 406 488 412 C510 417 533 417 556 412 C585 406 612 402 633 410 L548 471 C525 488 514 504 512 524 C509 505 499 488 476 471 Z" fill="url(#sand)" clip-path="url(#top-chamber)">
      <animate attributeName="opacity" values="1;0.3;1" dur="5s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-30; 0,0" dur="5s" repeatCount="indefinite" />
    </path>
    
    <!-- Sand particles flowing down -->
    <circle cx="480" cy="500" r="8" fill="#f2a332">
      <animateMotion path="M480,500 C480,550 512,575 512,620 C512,665 480,680 480,700" dur="5s" repeatCount="indefinite" rotate="auto" />
      <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="540" cy="520" r="8" fill="#f2a332">
      <animateMotion path="M540,520 C540,570 512,595 512,640 C512,685 540,700 540,720" dur="5s" repeatCount="indefinite" begin="0.5s" rotate="auto" />
      <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite" begin="0.5s" />
    </circle>
    <circle cx="512" cy="595" r="6.5" fill="#f2a332">
      <animateMotion path="M512,595 L512,730" dur="5s" repeatCount="indefinite" rotate="auto" />
      <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite" begin="1s" />
    </circle>
    
    <!-- Bottom sand - will grow as sand flows in -->
    <path d="M342 801 C344 772 362 753 393 737 L466 695 C485 684 499 674 512 671 C525 674 539 684 558 695 L631 737 C662 753 680 772 682 801 Z" fill="url(#sand2)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,30; 0,0" dur="5s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Static face that stays upright (not rotating) -->
  <g id="static-face">
    <circle cx="428" cy="315" r="21" fill="#26384f"/>
    <circle cx="596" cy="315" r="21" fill="#26384f"/>
    <path d="M487 341 C493 351 503 356 512 356 C522 356 532 351 537 341" fill="none" stroke="#26384f" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
