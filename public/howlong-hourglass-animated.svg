<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>HowLong animated hourglass</title>
  <desc>
    A looping animated HowLong hourglass. The hourglass slowly rotates 180 degrees
    around its center, settles, the sand always flows downward with gravity, and
    the face changes expression during the turn.
  </desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#293b58"/><stop offset="1" stop-color="#243752"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf6"/><stop offset=".55" stop-color="#fff9ed"/><stop offset="1" stop-color="#f7f0df"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0d0"/><stop offset="1" stop-color="#ead4aa"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#ffb63f"/><stop offset=".62" stop-color="#f5a72f"/><stop offset="1" stop-color="#df9525"/>
    </linearGradient>
    <linearGradient id="sand2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb642"/><stop offset="1" stop-color="#e49a29"/>
    </linearGradient>

    <!-- Masks keep the animated sand inside the two glass chambers. -->
    <clipPath id="topChamber">
      <path d="M322 220 C316 250 316 280 321 309 C329 350 352 384 390 414
               L456 465 C485 488 496 500 512 512
               C528 500 539 488 568 465 L634 414
               C672 384 695 350 703 309 C708 280 708 250 702 220 Z"/>
    </clipPath>
    <clipPath id="bottomChamber">
      <path d="M322 804 C316 775 316 744 321 715 C329 674 352 640 390 610
               L456 559 C485 536 496 524 512 512
               C528 524 539 536 568 559 L634 610
               C672 640 695 674 703 715 C708 744 708 775 702 804 Z"/>
    </clipPath>

    <!-- Small glow used when the face changes expression. -->
    <radialGradient id="faceGlow">
      <stop offset="0" stop-color="#ffd78a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffd78a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="205" fill="url(#bg)"/>

  <!-- ============================================================= -->
  <!-- ROTATING HOURGLASS SHELL                                     -->
  <!-- ============================================================= -->
  <g id="hourglass" transform="rotate(0 512 512)">

    <!-- glass silhouette -->
    <path d="M322 214 C309 243 308 279 314 311 C322 357 347 394 387 425 L454 477
             C483 500 483 522 454 547 L384 605 C340 641 315 686 315 735
             C315 760 320 785 326 802 L699 802 C706 783 710 758 710 735
             C710 686 684 641 640 605 L570 547 C541 522 541 500 570 477
             L637 425 C677 394 702 357 710 311 C716 279 715 243 702 214 Z"
          fill="url(#glass)"/>

    <!-- top and bottom wooden caps -->
    <rect x="274" y="133" width="476" height="61" rx="30.5" fill="url(#wood)"/>
    <rect x="319" y="192" width="386" height="28" rx="7" fill="#f3dfbd"/>
    <rect x="274" y="815" width="476" height="58" rx="29" fill="url(#wood)"/>
    <rect x="316" y="800" width="392" height="19" rx="7" fill="#f4e2c2"/>
    <path d="M305 145 H719" stroke="#fff7e6" stroke-width="7" stroke-linecap="round" opacity=".45"/>

    <!-- glass highlights -->
    <path d="M622 235 C658 243 680 271 680 305 C680 315 678 325 674 333"
          fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" opacity=".78">
      <animate attributeName="opacity" values=".62;.82;.62" dur="6.4s" repeatCount="indefinite"/>
    </path>
    <path d="M600 604 C640 628 667 664 670 705"
          fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" opacity=".72"/>

    <!-- ------------------------------------------------------------- -->
    <!-- FACE: expression changes while staying attached to the glass -->
    <!-- ------------------------------------------------------------- -->
    <g id="face">

      <!-- soft reaction glow -->
      <circle cx="512" cy="335" r="115" fill="url(#faceGlow)" opacity="0">
        <animate attributeName="opacity"
                 values="0;0;.32;0;0"
                 keyTimes="0;.20;.30;.42;1"
                 dur="6.4s" repeatCount="indefinite"/>
      </circle>

      <!-- eyebrows -->
      <path d="M402 286 Q428 270 454 286" fill="none" stroke="#26384f"
            stroke-width="9" stroke-linecap="round">
        <animate attributeName="d"
          values="M402 286 Q428 270 454 286;
                  M402 286 Q428 258 454 286;
                  M402 292 Q428 282 454 292;
                  M402 286 Q428 270 454 286"
          keyTimes="0;.24;.36;1" dur="6.4s" repeatCount="indefinite"/>
      </path>
      <path d="M570 286 Q596 270 622 286" fill="none" stroke="#26384f"
            stroke-width="9" stroke-linecap="round">
        <animate attributeName="d"
          values="M570 286 Q596 270 622 286;
                  M570 286 Q596 258 622 286;
                  M570 292 Q596 282 622 292;
                  M570 286 Q596 270 622 286"
          keyTimes="0;.24;.36;1" dur="6.4s" repeatCount="indefinite"/>
      </path>

      <!-- eyes -->
      <ellipse cx="428" cy="315" rx="21" ry="21" fill="#26384f">
        <animate attributeName="rx" values="21;21;26;18;21"
          keyTimes="0;.20;.28;.42;1" dur="6.4s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="21;21;27;18;21"
          keyTimes="0;.20;.28;.42;1" dur="6.4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="596" cy="315" rx="21" ry="21" fill="#26384f">
        <animate attributeName="rx" values="21;21;26;18;21"
          keyTimes="0;.20;.28;.42;1" dur="6.4s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="21;21;27;18;21"
          keyTimes="0;.20;.28;.42;1" dur="6.4s" repeatCount="indefinite"/>
      </ellipse>

      <!-- blink, layered on top -->
      <path d="M407 315 Q428 326 449 315" fill="none" stroke="#26384f"
            stroke-width="8" stroke-linecap="round" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0;0"
          keyTimes="0;.68;.71;.75;1" dur="6.4s" repeatCount="indefinite"/>
      </path>
      <path d="M575 315 Q596 326 617 315" fill="none" stroke="#26384f"
            stroke-width="8" stroke-linecap="round" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0;0"
          keyTimes="0;.68;.71;.75;1" dur="6.4s" repeatCount="indefinite"/>
      </path>

      <!-- mouth: smile -> surprised O -> smile -->
      <path d="M487 341 C493 351 503 356 512 356 C522 356 532 351 537 341"
            fill="none" stroke="#26384f" stroke-width="10" stroke-linecap="round">
        <animate attributeName="d"
          values="
          M487 341 C493 351 503 356 512 356 C522 356 532 351 537 341;
          M487 341 C494 348 503 352 512 352 C521 352 530 348 537 341;
          M498 343 C498 325 526 325 526 343 C526 362 498 362 498 343;
          M487 341 C493 351 503 356 512 356 C522 356 532 351 537 341"
          keyTimes="0;.20;.31;.43;1" dur="6.4s" repeatCount="indefinite"/>
      </path>

      <!-- tiny blush appears during the surprised/excited moment -->
      <ellipse cx="390" cy="348" rx="22" ry="10" fill="#ffb45d" opacity="0">
        <animate attributeName="opacity" values="0;0;.5;0;0"
          keyTimes="0;.20;.30;.43;1" dur="6.4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="634" cy="348" rx="22" ry="10" fill="#ffb45d" opacity="0">
        <animate attributeName="opacity" values="0;0;.5;0;0"
          keyTimes="0;.20;.30;.43;1" dur="6.4s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- ============================================================= -->
    <!-- SAND: two independent gravity-correct states                 -->
    <!-- ============================================================= -->

    <!-- UPRIGHT state: screen-top reservoir -> screen-bottom reservoir -->
    <g id="uprightSand" clip-path="url(#topChamber)">
      <path d="M355 410 Q420 395 470 415 Q512 430 554 415 Q604 395 669 410
               L560 486 Q535 503 512 512 Q489 503 464 486 Z"
            fill="url(#sand)">
        <animate attributeName="d"
          values="
          M355 410 Q420 395 470 415 Q512 430 554 415 Q604 395 669 410 L560 486 Q535 503 512 512 Q489 503 464 486 Z;
          M385 410 Q435 404 475 416 Q512 426 549 416 Q589 404 639 410 L552 476 Q532 489 512 500 Q492 489 472 476 Z;
          M430 410 Q465 407 490 416 Q512 422 534 416 Q559 407 594 410 L542 456 Q527 470 512 482 Q497 470 482 456 Z"
          keyTimes="0;.45;.9" dur="2.9s" begin="0s"
          repeatCount="indefinite"/>
      </path>

      <path d="M512 474 C510 500 510 530 512 570"
            stroke="#e89b2b" stroke-width="7" stroke-linecap="round" fill="none">
        <animate attributeName="opacity" values="1;1;0" keyTimes="0;.72;1"
                 dur="2.9s" repeatCount="indefinite"/>
      </path>

      <!-- falling grains -->
      <g fill="#f2a332">
        <circle cx="510" cy="565" r="5">
          <animate attributeName="cy" values="565;675;565" dur="1.15s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;1;0" dur="1.15s" repeatCount="indefinite"/>
        </circle>
        <circle cx="514" cy="575" r="4">
          <animate attributeName="cy" values="575;680;575" dur="1.15s" begin=".38s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;1;0" dur="1.15s" begin=".38s" repeatCount="indefinite"/>
        </circle>
        <circle cx="511" cy="582" r="3.5">
          <animate attributeName="cy" values="582;686;582" dur="1.15s" begin=".76s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;1;0" dur="1.15s" begin=".76s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <!-- growing bottom pile -->
    <path d="M342 801 C344 772 362 753 393 737 L466 695 C485 684 499 674 512 671
             C525 674 539 684 558 695 L631 737 C662 753 680 772 682 801 Z"
          fill="url(#sand2)">
      <animate attributeName="d"
        values="
        M342 801 C344 772 362 753 393 737 L466 695 C485 684 499 674 512 671 C525 674 539 684 558 695 L631 737 C662 753 680 772 682 801 Z;
        M342 801 C344 776 365 759 400 742 L470 708 C489 699 501 691 512 688 C523 691 535 699 554 708 L624 742 C659 759 680 776 682 801 Z;
        M342 801 C344 782 370 768 405 755 L474 731 C492 725 503 718 512 716 C521 718 532 725 550 731 L619 755 C654 768 680 782 682 801 Z"
        keyTimes="0;.45;.9" dur="2.9s" repeatCount="indefinite"/>
    </path>

    <!-- INVERTED state is drawn in screen coordinates and cross-fades in
         after the 180° turn. It therefore always flows screen-down. -->
    <g id="invertedSand" opacity="0" transform="rotate(180 512 512)">
      <!-- When rotated with the shell this occupies the opposite chamber. -->
      <path d="M342 801 C344 772 362 753 393 737 L466 695 C485 684 499 674 512 671
               C525 674 539 684 558 695 L631 737 C662 753 680 772 682 801 Z"
            fill="url(#sand2)">
        <animate attributeName="d"
          values="
          M342 801 C344 772 362 753 393 737 L466 695 C485 684 499 674 512 671 C525 674 539 684 558 695 L631 737 C662 753 680 772 682 801 Z;
          M342 801 C344 776 365 759 400 742 L470 708 C489 699 501 691 512 688 C523 691 535 699 554 708 L624 742 C659 759 680 776 682 801 Z;
          M342 801 C344 782 370 768 405 755 L474 731 C492 725 503 718 512 716 C521 718 532 725 550 731 L619 755 C654 768 680 782 682 801 Z"
          keyTimes="0;.45;.9" dur="2.9s" repeatCount="indefinite"/>
      </path>

      <path d="M512 474 C510 500 510 530 512 570"
            stroke="#e89b2b" stroke-width="7" stroke-linecap="round" fill="none"/>

      <g fill="#f2a332">
        <circle cx="510" cy="565" r="5">
          <animate attributeName="cy" values="565;675;565" dur="1.15s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;1;0" dur="1.15s" repeatCount="indefinite"/>
        </circle>
        <circle cx="514" cy="575" r="4">
          <animate attributeName="cy" values="575;680;575" dur="1.15s" begin=".38s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;1;0" dur="1.15s" begin=".38s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <!-- Flip state controls: the whole shell turns; the sand state swaps
         around the midpoint so gravity remains visually downward. -->
    <animateTransform attributeName="transform" type="rotate"
      values="0 512 512; 150 512 512; 180 512 512; 182 512 512; 180 512 512; 30 512 512; 0 512 512"
      keyTimes="0;.24;.43;.46;.50;.74;1"
      dur="6.4s"
      calcMode="spline"
      keySplines=".35 0 .65 1; .20 .85 .35 1; .35 0 .65 1; .35 0 .65 1; .35 0 .65 1; .35 0 .65 1"
      repeatCount="indefinite"/>

    <!-- Swap/crossfade sand visibility. -->
    <animate xlink:href="#uprightSand" attributeName="opacity"
      values="1;1;1;0;0;1;1"
      keyTimes="0;.24;.40;.48;.74;.86;1"
      dur="6.4s" repeatCount="indefinite"/>
    <animate xlink:href="#invertedSand" attributeName="opacity"
      values="0;0;0;1;1;0;0"
      keyTimes="0;.24;.40;.48;.74;.86;1"
      dur="6.4s" repeatCount="indefinite"/>
  </g>
</svg>
