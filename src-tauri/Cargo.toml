[package]
name = "howlong"
version = "0.5.2"
description = "HowLong? — No More XLSX"
authors = ["Pietro Di Leo"]
edition = "2021"

[lib]
name = "howlong_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
