name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.name }}
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: '--config src-tauri/tauri.release.conf.json --target x86_64-pc-windows-msvc'
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: '--config src-tauri/tauri.release.conf.json --target x86_64-unknown-linux-gnu'
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            args: '--config src-tauri/tauri.release.conf.json --target x86_64-apple-darwin'
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            args: '--config src-tauri/tauri.release.conf.json --target aarch64-apple-darwin'

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libappindicator3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate release notes
        id: release-notes
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const fallbackBody = [
              `Stable HowLong release ${context.ref_name}.`,
              '',
              'Automatic release notes were unavailable. See the commits and changes associated with this tag on GitHub.',
            ].join('\\n');

            try {
              const response = await github.rest.repos.generateReleaseNotes({
                owner,
                repo,
                tag_name: context.ref_name,
              });

              const body = response?.data?.body;
              if (typeof body === 'string' && body.trim()) {
                core.setOutput('body', body);
                return;
              }

              core.warning('GitHub returned no generated release-notes body.');
            } catch (error) {
              core.warning(`Release-notes generation failed: ${String(error)}`);
            }

            core.setOutput('body', fallbackBody);

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: HowLong ${{ github.ref_name }}
          releaseBody: ${{ steps.release-notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          retryAttempts: 3
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          args: ${{ matrix.args }}
